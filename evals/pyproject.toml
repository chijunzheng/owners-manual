[project]
name = "owners-manual-evals"
version = "0.0.0"
description = "Python eval harness for owners-manual — golden/adversarial datasets, citation-accuracy scoring, RAGAS, Langfuse. Treats the TS service as a black box over HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Langfuse is the sole system of record for traces/scores (issue #4). The v4
  # client is OTel-native; imported lazily so unit tests need no server.
  "langfuse>=4,<5",
  # Golden items are authored in YAML (issue #30). Loaded with yaml.safe_load —
  # the schema is then validated strictly in pure Python, so PyYAML only does
  # the surface parse, never any type coercion of golden-item fields.
  "pyyaml>=6,<7",
]

[project.scripts]
hello-trace = "owners_manual_evals.hello_trace_cli:main"
run-naive-rag = "owners_manual_evals.run_naive_rag:main"
compare-hybrid = "owners_manual_evals.compare_hybrid:main"
compare-arms = "owners_manual_evals.compare_arms:main"
compare-four-arms = "owners_manual_evals.compare_four_arms:main"
order-probe = "owners_manual_evals.order_probe:main"
run-variance = "owners_manual_evals.run_variance:main"
release-digest = "owners_manual_evals.release_digest:main"
run-smoke = "owners_manual_evals.smoke_runner:main"
smoke-find-comment = "owners_manual_evals.smoke_pr_comment:main"
ablation-ladders = "owners_manual_evals.ablation_ladders:main"
generate-ablation-readme = "owners_manual_evals.ablation_tables:main"
calibrate = "owners_manual_evals.calibration_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
# RAGAS context metrics for the RAG arms (ADR 0009) — its OWN optional group, NOT
# pulled by `uv sync` of the base/dev surface. ragas_live.py imports both lazily,
# so the offline unit suite mocks the evaluator seam and never installs either.
# ragas runs LLM-only over Gemini-on-Vertex (ADR 0005) via langchain-google-vertexai,
# so no embedding dependency is declared. Install with `uv sync --group ragas`.
ragas = [
  "ragas>=0.2,<0.3",
  "langchain-google-vertexai>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owners_manual_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
