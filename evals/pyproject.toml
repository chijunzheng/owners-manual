[project]
name = "owners-manual-evals"
version = "0.0.0"
description = "Python eval harness for owners-manual — golden/adversarial datasets, citation-accuracy scoring, RAGAS, Langfuse. Treats the TS service as a black box over HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Langfuse is the sole system of record for traces/scores (issue #4). The v4
  # client is OTel-native; imported lazily so unit tests need no server.
  "langfuse>=4,<5",
  # Golden items are authored in YAML (issue #30). Loaded with yaml.safe_load —
  # the schema is then validated strictly in pure Python, so PyYAML only does
  # the surface parse, never any type coercion of golden-item fields.
  "pyyaml>=6,<7",
]

[project.scripts]
hello-trace = "owners_manual_evals.hello_trace_cli:main"
run-naive-rag = "owners_manual_evals.run_naive_rag:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owners_manual_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
