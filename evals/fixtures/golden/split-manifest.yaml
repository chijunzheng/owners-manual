# Frozen dev/holdout assignment for golden PARENT items (ADR 0007).
#
# Generated once from the corpus x behavior-class stratified ~70/30 split and
# thereafter AUTHORITATIVE: a parent listed here keeps its recorded side, so
# growing the golden set never migrates an already-assigned item across the
# holdout seal (golden_split.assign_split honors this map before it assigns).
# New parents (absent here) append into each stratum's remaining dev quota in
# SHA-256(id) order, defaulting to holdout once that quota is full -- so an
# addition can never evict a frozen item. Paraphrases inherit their parent and
# are intentionally absent. Regenerate ONLY at a deliberate milestone, never to
# paper over a diff (that would unseal the holdout).
