# Frozen dev/holdout side of EVERY committed golden PARENT (ADR 0007).
#
# AUTHORITATIVE: a parent listed here keeps its recorded side, so growing the
# golden set never migrates an already-assigned item across the holdout seal
# (golden_split.assign_split honors this map before it assigns). Authoring a new
# parent computes its side via the stratified fill (assign_split fills the
# stratum's remaining dev quota in SHA-256(id) order, else holdout) and RECORDS
# the result here in the SAME change -- an unrecorded parent is not actually
# frozen (it is recomputed each load, and a later sibling could move it across
# the seal), so a guard test asserts this manifest lists exactly the parent set.
# Paraphrases inherit their parent and are intentionally absent. Regenerate ONLY
# at a deliberate milestone, never to paper over a diff (that unseals the holdout).
