# Golden set v1 — cross-corpus slice (issue #22). One file of the per-corpus
# golden directory evals/fixtures/golden/items/; the loader concatenates every
# *.yaml there into one validated set.
#
# Scope (the #60 corpus<->cites guardrail): an item's corpus follows its cites —
# a single corpus when every cite lands in one, "cross-corpus" when the required
# cites span two or more. These are the genuinely multi-instrument questions: the
# right answer cannot be read out of any one document, so the system has to fan
# out across the insurance policies, the governing documents (the Condominium
# Act and the declaration), and the tenancy statute.
#
# Two of these are the cross-corpus FACETS of the insurance conflicts whose
# policy-reading halves live in insurance.yaml. INS-01 and INS-02 each pose a
# question the policy alone cannot close: the policy insures only the "standard
# unit" but defines it by reference to a by-law that is not in the corpus
# (INS-01), and the policy charges the deductible only as the declaration and
# the Act provide (INS-02). The fan-out item routes from the insurance question
# into the governing instruments that actually resolve it. The third family,
# LEASE-01 (the void no-pets clause), is the original cross-corpus item from v0,
# moved here from tenancy.yaml so every cross-corpus item lives in one file. A
# fourth family, GOV-06, bridges the governing documents and the tenancy
# statute: a Rule that deems a late-filed tenant a trespasser and gates her
# possession is measured against the owner's narrow ten-day leasing-notice duty
# (Condo Act s.83 and the declaration) and the tenant's RTA possession rights.
#
# Hand-verification protocol (unchanged from #9): every item lands verified:
# false and flips true ONLY on the owner's per-item sign-off against a local
# verification packet that quotes the resolved text of every required cite. Git
# history is the audit record; the eval runner's verified-only filter excludes
# unsigned items from real runs. Like the insurance slice, these items cite the
# policy fixtures and/or the Condo Act, which the live index does not yet hold,
# so they are not live-serviceable and stay gated out of live/smoke runs.
#
# No Crown-copyright statute text appears here: cites are addressing-only citable
# paths into the committed trees (evals/fixtures/golden/trees/), and answer-point
# text is claim-level paraphrase.

version: 2
items:
  # INS-01 (cross-corpus facet): the standard-unit boundary. The insurance-only
  # facet (answer-improvements-not-covered) establishes that upgrades beyond the
  # standard unit are insured by neither policy. This fan-out answers the next
  # question — where exactly is that boundary? — and the discriminating behavior
  # is recognizing that the answer lives in a by-law absent from the corpus and
  # routing the owner to a records request under Condo Act s.55, rather than
  # guessing the boundary from the policy or declaration text.
  - id: answer-standard-unit-records-request
    behavior_class: answer
    corpus: cross-corpus
    verified: true
    question: >-
      My condo's insurance only covers the "standard unit," and both the master
      policy and the declaration say what the standard unit actually is gets
      defined in the corporation's by-laws. I've never seen those by-laws. How
      do I find out where the standard unit ends and my own upgrades begin, so I
      know what I have to insure myself?
    answer_points:
      - id: boundary-lives-in-the-by-laws
        text: What counts as the "standard unit" — and therefore where an
          owner's own improvements begin — is fixed by the corporation's
          by-laws. Both the master policy and the declaration define the insured
          standard unit by reference to the by-laws rather than setting the
          boundary out themselves.
      - id: by-law-absent-from-these-sources
        text: That standard-unit by-law is not among the documents available
          here — the declaration, the policies, and the rules — so these sources
          alone cannot say exactly where the standard unit ends; the boundary
          depends on a by-law the owner has not seen.
      - id: by-laws-are-an-obtainable-record
        text: The corporation is required to keep a copy of its declaration,
          by-laws, and rules among its records, and to permit an owner, or the
          owner's authorized agent, to examine or obtain copies of those
          records. The standard-unit by-law is therefore a record the owner is
          entitled to request.
      - id: obtain-it-then-anything-above-is-the-owners
        text: The owner should obtain the standard-unit by-law through a records
          request and read the boundary from it; anything in the unit beyond
          that standard unit, such as upgraded flooring or counters, is an
          improvement the corporation's insurance does not cover and that the
          owner must insure under their own policy.
    required_cites:
      - documentId: fixture-master-policy
        segments:
          - { kind: section, label: insured-property }
          - { kind: clause, label: p-2 }
      - documentId: fixture-master-policy
        segments:
          - { kind: section, label: insured-property }
          - { kind: clause, label: p-3 }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-i-definitions }
          - { kind: clause, label: p-9 }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-v-insurance }
          - { kind: clause, label: p-2 }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: IV }
          - { kind: section, label: '55' }
          - { kind: subsection, label: '1' }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: IV }
          - { kind: section, label: '55' }
          - { kind: subsection, label: '3' }
    provenance:
      source: designed-fixture
      reference: 'FIXTURE-DESIGN.md INS-01 — undefined standard unit
        (cross-corpus fan-out: the boundary lives in a by-law absent from the
        corpus, routing the owner to a records request under Condo Act s.55)'
    tags:
      difficulty: hard
      persona: owner
      fixture: INS-01

  # INS-02 (cross-corpus facet): the no-fault deductible chargeback. The
  # insurance-only facet (answer-policy-defers-deductible) establishes that the
  # master policy does not itself impose the deductible — it defers to the
  # declaration and the Act. This fan-out answers whether the corporation can
  # charge the owner on a NO-FAULT basis, and the discriminating behavior is the
  # distinction Condo Act s.105 draws: a fault-based charge (s.105(2)) is
  # automatic, but the no-fault extension (s.105(3)) must be made by a by-law.
  # The fixture corpus deliberately omits by-laws, so the right answer does NOT
  # equate the declaration's regardless-of-fault clause with the required by-law;
  # it flags that a no-fault charge turns on a by-law the owner has not seen and
  # should obtain by a records request (cf. INS-01), while the deductible cap and
  # the Coverage C backstop hold regardless. (Narrowed after Codex #64 P1: the
  # earlier wording treated the declaration AS the s.105(3) by-law, which would
  # mark a correct cautious answer wrong.)
  - id: answer-deductible-chargeback-no-fault
    behavior_class: answer
    corpus: cross-corpus
    verified: true
    question: >-
      A pipe failed inside my unit and the corporation's insurance is paying to
      repair the damage. The property manager now says I have to pay the
      policy's deductible — and that it doesn't matter that the failure wasn't
      my fault. Can the corporation really make me pay that?
    answer_points:
      - id: policy-sends-you-to-the-declaration
        text: The master policy does not itself decide this; it states that
          whether and on what terms an owner is charged the deductible is set out
          in the corporation's declaration, not in the policy. The answer
          therefore turns on the declaration and the Condominium Act.
      - id: act-charges-fault-based-damage-automatically
        text: Under the Act the part of a loss left uncovered by the policy's
          deductible is a common expense, and where an owner, the owner's tenant,
          or someone living in the unit causes damage to that unit through an act
          or omission, the lesser of the repair cost and the deductible is added
          automatically to that owner's common expenses. That automatic charge
          depends on an act or omission.
      - id: no-fault-charge-requires-a-by-law
        text: A no-fault charge is different. The Act lets the corporation extend
          the deductible charge to damage not caused by the owner's act or
          omission only by passing a by-law to that effect; without such a
          by-law the Act's automatic charge reaches only fault-based damage.
      - id: declaration-purports-no-fault-but-the-by-law-is-absent
        text: This corporation's declaration does contain a chargeback worded to
          apply regardless of fault, capped at the deductible amount stated in
          the policy and collectible as a common expense by a lien. But the
          corporation's by-laws are not among the available documents, and the
          Act locates the no-fault extension in a by-law — so whether a no-fault
          charge is actually authorized turns on a by-law the owner has not seen
          and that these sources do not contain.
      - id: bottom-line-confirm-the-by-law-capped-and-coverage-c
        text: So a fault-based deductible charge is clearly authorized, but a
          no-fault charge depends on a by-law the owner should obtain through a
          records request before treating it as settled; either way any such
          charge is capped at the policy's deductible, and the owner's own
          unit-policy loss-assessment coverage (Coverage C) is the backstop for
          that amount, up to its limit.
    required_cites:
      - documentId: fixture-master-policy
        segments:
          - { kind: section, label: deductible-responsibility }
          - { kind: clause, label: p-1 }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: VI }
          - { kind: section, label: '105' }
          - { kind: subsection, label: '1' }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: VI }
          - { kind: section, label: '105' }
          - { kind: subsection, label: '2' }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: VI }
          - { kind: section, label: '105' }
          - { kind: subsection, label: '3' }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-v-insurance }
          - { kind: subsection, label: deductible-chargeback }
          - { kind: clause, label: p-1 }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-v-insurance }
          - { kind: subsection, label: deductible-chargeback }
          - { kind: clause, label: p-2 }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: IV }
          - { kind: section, label: '55' }
          - { kind: subsection, label: '1' }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: IV }
          - { kind: section, label: '55' }
          - { kind: subsection, label: '3' }
      - documentId: fixture-unit-policy
        segments:
          - { kind: section, label: coverage-c-loss-assessment-and-deductible }
          - { kind: clause, label: p-1 }
    provenance:
      source: designed-fixture
      reference: 'FIXTURE-DESIGN.md INS-02 — deductible chargeback (cross-corpus
        fan-out: a no-fault charge requires a s.105(3) by-law absent from the
        corpus, so the answer routes to a records request rather than equating
        the declaration with the by-law; the cap and Coverage C backstop hold)'
    tags:
      difficulty: hard
      persona: owner
      fixture: INS-02

  # GOV-06 (governing <-> tenancy bridge): tenant-gatekeeping overreach. Rule 3
  # deems a lessee a "trespasser" and bars her from booking the moving elevator
  # or taking possession if the owner has not filed the lease and the lessee's
  # government ID within thirty days. That collides with three instruments at
  # once: the owner's leasing duty is narrow (Condo Act s.83(1) and the
  # declaration's Article VI require only a ten-day notice with the lessee's
  # name, the owner's address, and a copy or summary of the lease — no lessee
  # ID, no possession gate); a rule must be reasonable and consistent with the
  # Act and the declaration (s.58(2)); and the tenant's possession is protected
  # by the RTA, under which a tenancy ends only in accordance with that Act and
  # possession is recovered only on vacancy or a Board eviction order (s.37(1),
  # s.39) — so a condominium corporation, which is not the landlord, cannot turn
  # a lawful tenant into a trespasser. Precision control: the corporation MAY
  # still reasonably regulate move logistics (Rule 4 booking), and the remedy for
  # an owner's notice default is a compliance order against the OWNER (s.134(1)),
  # not self-help against the tenant. Cross-corpus (governing rules + declaration
  # + Condo Act, and the tenancy statute).
  - id: flag-tenant-not-a-trespasser
    behavior_class: flag-void-clause
    corpus: cross-corpus
    verified: true
    question: >-
      My tenant moves in this Saturday, but the management office says that
      because I have not filed her paperwork yet she is a trespasser, and they
      will not let her book the moving elevator or take possession of the unit
      until I hand in her government ID. Can the condo really block my tenant
      like that?
    answer_points:
      - id: leasing-notice-duty-is-narrow
        text: The only leasing obligation the Act and the declaration place on an
          owner who leases is to notify the corporation within ten days of the
          lease or its renewal, to provide the lessee's name, the owner's
          address, and a copy or summary of the lease, and to give the lessee a
          copy of the declaration, by-laws, and rules. The declaration's own
          leasing article states this ten-day baseline and adds that it does not
          derogate from the owner's obligations under section 83 of the Act.
          Neither the Act nor the declaration requires the lessee to produce
          government-issued identification, and neither makes the lessee's
          possession of the unit depend on the owner having filed anything.
      - id: rule-adds-requirements-the-instruments-do-not
        text: Rule 3 demands filing within thirty days and government-issued
          identification for every lessee, a deadline and an identification
          requirement that neither the Act nor the declaration imposes on the
          owner or the lessee. A rule made by the board must be reasonable and
          consistent with the Act, the declaration, and the by-laws, so to the
          extent the Rule adds obligations and consequences the governing
          instruments do not contain, it is unenforceable.
      - id: corporation-cannot-deem-a-tenant-a-trespasser
        text: The lessee's right to occupy the unit flows from her tenancy, not
          from the corporation's leasing file. Under the Residential Tenancies
          Act, a tenancy may be terminated only in accordance with that Act, and
          possession of a rental unit may be recovered only after the tenant
          vacates or abandons it or the Landlord and Tenant Board orders
          eviction, and then only by the landlord. The condominium corporation is
          neither the landlord nor a party to the tenancy, so it cannot by rule
          convert a lawful tenant into a trespasser or bar her from taking
          possession of the unit because of the owner's paperwork.
      - id: reasonable-move-logistics-are-a-separate-matter
        text: The corporation may still reasonably regulate how and when
          residents use the common elements for a move, such as requiring the
          moving elevator, loading dock, and service corridor to be reserved in
          advance and used only during designated hours. What it cannot do is
          turn that logistical power into a means of denying a lawful tenant
          possession of her own unit, which is the effect the Rule's trespasser
          provision purports to have.
      - id: remedy-for-an-owners-default-runs-against-the-owner
        text: If an owner fails to give the leasing notice the Act requires, the
          corporation's recourse is to enforce that obligation against the owner,
          including by an application for a compliance order if necessary, and
          not by self-help against the tenant. The tenant is not the party in
          default, and the consequences of an owner's non-compliance cannot
          lawfully be visited on her.
    required_cites:
      - documentId: fixture-rules
        segments:
          - { kind: section, label: rule-3-leasing-and-occupancy }
          - { kind: clause, label: p-2 }
      - documentId: fixture-rules
        segments:
          - { kind: section, label: rule-3-leasing-and-occupancy }
          - { kind: clause, label: p-3 }
      - documentId: fixture-rules
        segments:
          - { kind: section, label: rule-4-use-of-the-common-elements }
          - { kind: clause, label: p-2 }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-vi-leasing-of-units }
          - { kind: clause, label: p-1 }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-vi-leasing-of-units }
          - { kind: clause, label: p-3 }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: V }
          - { kind: section, label: '83' }
          - { kind: subsection, label: '1' }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: IV }
          - { kind: section, label: '58' }
          - { kind: subsection, label: '2' }
      - documentId: rta-2006
        segments:
          - { kind: part, label: V }
          - { kind: section, label: '37' }
          - { kind: subsection, label: '1' }
      - documentId: rta-2006
        segments:
          - { kind: part, label: V }
          - { kind: section, label: '39' }
      - documentId: condo-act-1998
        segments:
          - { kind: part, label: IX }
          - { kind: section, label: '134' }
          - { kind: subsection, label: '1' }
    provenance:
      source: designed-fixture
      reference: 'FIXTURE-DESIGN.md GOV-06 — tenant-gatekeeping overreach
        (cross-corpus: a Rule that deems a late-filed tenant a trespasser and
        gates possession overreaches the narrow ten-day leasing-notice duty in
        Condo Act s.83(1) and the declaration, the limit on rule-making in
        s.58(2), and the tenant possession rights protected by RTA s.37 and
        s.39; the remedy for a leasing-notice default is a compliance order
        against the owner under s.134)'
    tags:
      difficulty: hard
      persona: landlord
      fixture: GOV-06

  # LEASE-01: the lease's blanket no-pets clause is void (RTA s.14), but the
  # naive "you're fine" answer is incomplete — the condominium declaration is
  # not a tenancy-agreement provision, the lease itself incorporates the condo
  # documents, and the declaration's pet limits (two household pets, cat/dog
  # <= 20 kg) still govern. For a single cat the declaration PERMITS the pet,
  # subject to its nuisance-removal power. Cross-corpus (lease + RTA +
  # declaration); moved here from tenancy.yaml to consolidate the slice.
  - id: flag-void-no-pets
    behavior_class: flag-void-clause
    corpus: cross-corpus
    verified: true
    question: >-
      My condo lease says no pets of any kind, but I got a cat anyway. Can my
      landlord actually do anything about it?
    answer_points:
      - id: lease-clause-void
        text: A tenancy-agreement provision prohibiting animals in or about the
          residential complex is void, so the lease's no-pets clause is
          unenforceable by the landlord.
      - id: declaration-still-binds
        text: The condominium declaration is not a provision in a tenancy
          agreement, so its pet rules are not voided and continue to bind the
          unit's occupants.
      - id: cat-within-limits
        text: A single cat falls within the declaration's limit of two
          household pets (cats or dogs up to 20 kg), so the cat itself is
          permitted, subject to the board's power to require removal of a pet
          that becomes a nuisance.
    required_cites:
      - documentId: fixture-lease
        segments:
          - { kind: section, label: pets }
          - { kind: clause, label: p-1 }
      - documentId: rta-2006
        segments:
          - { kind: part, label: II }
          - { kind: section, label: '14' }
      - documentId: fixture-declaration
        segments:
          - { kind: section, label: article-iii-use-and-occupation-of-units }
          - { kind: subsection, label: pets }
          - { kind: clause, label: p-1 }
    provenance:
      source: designed-fixture
      reference: 'FIXTURE-DESIGN.md LEASE-01 — void no-pets clause with the
        condo-pathway fan-out'
    tags:
      difficulty: hard
      persona: tenant
      fixture: LEASE-01

